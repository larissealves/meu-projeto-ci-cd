name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Create test environment
        run: |
          echo "NODE_ENV=test" > .env.test
          echo "APP_NAME=${{ vars.APP_NAME_TEST }} " >> .env.test
          echo "TEST_SECRET=${{ secrets.TEST_SECRET }}" >> .env.test

      - name: Check test environment
        run: |
          source .env.test
          test -n "$TEST_SECRET"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run web lint
        run: pnpm --filter @env-training/web lint

      - name: Build web
        run: pnpm --filter @env-training/web build